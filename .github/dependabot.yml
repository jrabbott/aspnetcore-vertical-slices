# Dependabot: few grouped PRs, weekly NuGet / monthly Actions + Docker.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # One PR for routine bumps (CPM + lock files stay in sync).
      nuget-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors stay separate so breaking changes are reviewable.
      nuget-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Runtime base image in Dockerfile (aspnet). Keep majors tied to TFM upgrades.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/aspnet"
        update-types:
          - "version-update:semver-major"
