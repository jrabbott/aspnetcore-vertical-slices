name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and package image
    runs-on: ubuntu-latest
    env:
      # Enables ContinuousIntegrationBuild + TreatWarningsAsErrors (Directory.Build.props).
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build, test, and publish
        uses: ./.github/actions/build-test-publish

      - name: Build container image
        run: |
          cp .dockerignore .publish/web/.dockerignore
          docker build -f Dockerfile -t weatherapp:ci ./.publish/web

      - name: Smoke health endpoint
        run: |
          docker run --rm -d --name weatherapp-ci -p 8080:8080 weatherapp:ci
          trap 'docker stop weatherapp-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not become ready in time" >&2
          docker logs weatherapp-ci >&2 || true
          exit 1
