name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and package image
    runs-on: ubuntu-latest
    env:
      # Enables ContinuousIntegrationBuild + TreatWarningsAsErrors (Directory.Build.props).
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      E2E_IMAGE: weatherapp:ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build, test, and publish
        uses: ./.github/actions/build-test-publish

      - name: Build container image
        run: |
          cp .dockerignore .publish/web/.dockerignore
          docker build -f Dockerfile -t "$E2E_IMAGE" ./.publish/web

      - name: Run e2e tests
        run: >
          dotnet test tests/WeatherApp.E2E.Tests/WeatherApp.E2E.Tests.csproj
          --configuration Release
          -p:IncludeE2E=true
          --verbosity minimal
